<style>
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#1B2A41; --muted:#5D6B80; --line:#D6DDE6;
  --signal:#F5B800; --signal-ink:#1B2A41; --rail:#2E7D5B; --stop:#B3261E;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1724;--surface:#18233A;--ink:#E9EEF5;--muted:#9AA7BA;--line:#2A3853;--signal:#FFC72C;--signal-ink:#14203A;--rail:#4CC28C;--stop:#FF8A80;color-scheme:dark}
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 28px}
.num{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;line-height:1}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--rail);outline-offset:2px}
h1{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:1.7rem;margin:0 0 4px}
h2{font-size:1rem;margin:22px 0 8px}
.muted{color:var(--muted);font-weight:400}
.note{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.err{color:var(--stop);font-weight:700;font-size:.9rem;min-height:1.3em;margin:8px 0}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:.85rem;font-weight:700;margin-bottom:4px}
.field input,.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
.primary{width:100%;border:0;border-radius:14px;background:var(--rail);color:#fff;padding:15px;font-weight:700;font-size:1.05rem}
.primary:disabled{opacity:.6}
.link{background:none;border:0;color:var(--rail);font-weight:700;padding:10px;display:block;margin:6px auto 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:.9rem}
.bar button{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem}
.sync{font-size:.8rem;font-weight:700;color:var(--stop)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.head .num{font-size:3.4rem}
.head .num small{font-size:1.1rem;color:var(--muted);font-weight:600;margin-left:4px}
.last{text-align:right;color:var(--muted);font-weight:700;font-size:.9rem}
.last b{display:block;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:2.2rem;line-height:1;color:var(--rail)}
.meta{color:var(--muted);font-size:.9rem;margin:4px 0 16px}
.prompt{font-weight:700;margin:0 0 8px}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.seat{border:0;border-radius:16px 16px 10px 10px;background:var(--signal);color:var(--signal-ink);font-size:2.4rem;padding:18px 0 14px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);transition:transform .08s}
.seat:active{transform:translateY(3px)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-height:380px;overflow:auto;-webkit-overflow-scrolling:touch}
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.rowbtn{display:grid;grid-template-columns:3.6rem 1fr auto;align-items:center;width:100%;background:none;border:0;padding:11px 14px;text-align:left;gap:8px}
.rowbtn.wide{grid-template-columns:1fr auto}
.rowbtn .no{font-weight:700}
.rowbtn .t{color:var(--muted);font-variant-numeric:tabular-nums}
.rowbtn .k{font-weight:700}
.edit{display:none;gap:6px;padding:0 14px 12px;align-items:center;flex-wrap:wrap}
.item.open .edit{display:flex}
.item.open>.rowbtn{background:color-mix(in srgb,var(--signal) 14%,transparent)}
.chip{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;font-weight:800}
.chip.on{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.chip.del{flex:1.4;color:var(--stop);font-weight:700}
.chip.ok{background:var(--rail);border-color:var(--rail);color:#fff}
.chip.delok{background:var(--stop);border-color:var(--stop);color:#fff}
.q{flex:1 1 100%;font-size:.9rem;font-weight:700}
.edit .inp{flex:1 1 100%;padding:10px}
.sub{padding:0 14px 10px}
.sub div{display:flex;justify-content:space-between;font-size:.9rem;padding:4px 0;border-top:1px dashed var(--line)}
.empty{padding:22px 14px;color:var(--muted);text-align:center}
.report{margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.95rem;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){.seat{font-size:2rem}}
</style>
</head>
<body>
<div class="wrap">
  <div id="vLoading"><h1>Tren tur sayacı</h1><p class="note" id="loadMsg">Bağlanıyor…</p></div>

  <div id="vLogin" hidden>
    <h1>Tren tur sayacı</h1>
    <p class="note" id="loginNote">Kullanıcı adın ve şifrenle giriş yap.</p>
    <label class="field"><span>Kullanıcı adı</span><input id="lUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
    <label class="field"><span>Şifre</span><input id="lPass" type="password" autocomplete="current-password"></label>
    <div class="err" id="lErr"></div>
    <button class="primary" id="lGo">Giriş yap</button>
    <button class="link" id="lSwitch">Hesabın yok mu? Hesap aç</button>
  </div>

  <div id="vStaff" hidden>
    <div class="bar"><span id="sWho"></span><span class="sync" id="sSync" hidden>Kaydedilmeyi bekliyor</span><button data-logout>Çıkış</button></div>
    <div class="head">
      <div class="num" id="tourNo">0<small>tur</small></div>
      <div class="last" id="last">Henüz tur yok</div>
    </div>
    <div class="meta" id="meta">Bugün henüz tur yok</div>
    <p class="prompt" id="prompt">1. tur: kaç kişi bindi?</p>
    <div class="seats" id="seats"></div>
    <h2>Bugünkü turlar <span class="muted">(düzeltmek için dokun)</span></h2>
    <div class="list" id="list"></div>
    <button class="primary report" id="sReport">Rapor al (Excel)</button>
  </div>

  <div id="vAdmin" hidden>
    <div class="bar"><span id="aWho"></span><button data-logout>Çıkış</button></div>
    <h1>Yönetici paneli</h1>
    <label class="field"><span>Gün</span><input id="aDate" type="date"></label>
    <p class="note" id="aSum"></p>
    <div class="list" id="aDays"></div>
    <button class="primary report" id="aReport">Bu günün raporunu al (Excel)</button>
    <h2>Kullanıcılar <span class="muted">(şifre değiştirmek için dokun)</span></h2>
    <div class="list" id="aUsers"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const hm = ms => { const d = new Date(ms); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const hms = ms => hm(ms) + ":" + pad(new Date(ms).getSeconds());
const dateKey = (d = new Date()) => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const trDate = key => key.split("-").reverse().join(".");
const sumN = r => r.reduce((a, x) => a + x.n, 0);
const SESSION = "tren-oturum", BACKUP = "tren-yedek";
const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };

function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2200); }
function show(v){ ["vLoading","vLogin","vStaff","vAdmin"].forEach(x => $(x).hidden = x !== v); }
async function hash(user, pass){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("tren:" + user + ":" + pass));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

let sb = null, me = null, timers = [];
const stopTimers = () => { timers.forEach(clearInterval); timers = []; };

// ---------- Başlangıç ----------
(async () => {
  if (SUPABASE_URL.startsWith("BURAYA") || SUPABASE_KEY.startsWith("BURAYA")){
    $("loadMsg").textContent = "Kurulum tamamlanmadı: index.html içindeki SUPABASE_URL ve SUPABASE_KEY alanlarını doldur."; return;
  }
  if (!window.supabase){ $("loadMsg").textContent = "Bağlantı kurulamadı. İnterneti kontrol edip sayfayı yenile."; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
  const saved = ls.get(SESSION);
  if (saved){
    const { data } = await sb.from("accounts").select("username, role").eq("username", saved).maybeSingle();
    if (data) return enter(data);
  }
  show("vLogin");
})();

// ---------- Giriş ----------
let registerMode = false;
$("lSwitch").onclick = () => {
  registerMode = !registerMode;
  $("lGo").textContent = registerMode ? "Hesap aç" : "Giriş yap";
  $("lSwitch").textContent = registerMode ? "Hesabın var mı? Giriş yap" : "Hesabın yok mu? Hesap aç";
  $("loginNote").textContent = registerMode ? "Kendine bir kullanıcı adı ve şifre seç." : "Kullanıcı adın ve şifrenle giriş yap.";
  $("lPass").autocomplete = registerMode ? "new-password" : "current-password";
  $("lErr").textContent = "";
};
$("lPass").addEventListener("keydown", e => { if (e.key === "Enter") $("lGo").click(); });
$("lGo").onclick = async () => {
  const user = $("lUser").value.trim().toLowerCase(), pass = $("lPass").value;
  const err = m => { $("lErr").textContent = m; };
  if (!/^[a-z0-9._-]{3,20}$/.test(user)) return err("Kullanıcı adı 3–20 karakter olmalı; Türkçe harf ve boşluk kullanma (örn. ayse.k).");
  if (pass.length < 4) return err("Şifre en az 4 karakter olmalı.");
  $("lGo").disabled = true;
  try {
    const h = await hash(user, pass);
    if (registerMode){
      const { error } = await sb.from("accounts").insert({ username: user, hash: h, role: "staff" });
      if (error) return err(error.code === "23505" ? "Bu kullanıcı adı alınmış, başka bir tane seç." : "Hesap açılamadı: " + error.message);
      toast("Hesap açıldı");
      enter({ username: user, role: "staff" });
    } else {
      const { data, error } = await sb.from("accounts").select("username, role, hash").eq("username", user).maybeSingle();
      if (error) return err("Bağlantı hatası, tekrar dene.");
      if (!data || data.hash !== h) return err("Kullanıcı adı veya şifre yanlış.");
      enter(data);
    }
  } catch(e){ err("Bağlantı hatası, tekrar dene."); }
  finally { $("lGo").disabled = false; }
};
document.querySelectorAll("[data-logout]").forEach(b => b.onclick = () => {
  ls.del(SESSION); stopTimers(); me = null; $("lPass").value = ""; show("vLogin");
});
function enter(acc){
  me = { user: acc.username, role: acc.role };
  ls.set(SESSION, me.user); stopTimers();
  if (me.role === "admin") startAdmin(); else startStaff();
}

// ---------- Personel ----------
let rides = [], dayKeyNow = "", openIdx = -1, pending = null, dirty = false, saving = false;

async function startStaff(){
  $("sWho").innerHTML = "Personel: <b>" + me.user + "</b>";
  show("vStaff");
  await loadDay();
  timers.push(setInterval(() => { if (dateKey() !== dayKeyNow) loadDay(); else if (dirty) flush(); renderHead(); }, 30000));
}
async function loadDay(){
  dayKeyNow = dateKey(); openIdx = -1; pending = null;
  const bk = JSON.parse(ls.get(BACKUP) || "null");
  if (bk && bk.id === dayKeyNow + "_" + me.user && bk.dirty){ rides = bk.rides; dirty = true; renderStaff(); return flush(); }
  rides = []; renderStaff();
  const { data, error } = await sb.from("days").select("rides").eq("id", dayKeyNow + "_" + me.user).maybeSingle();
  if (error) toast("Kayıtlar yüklenemedi, interneti kontrol et");
  rides = (data && data.rides) || [];
  renderStaff();
}
function saveDay(next){
  rides = next; dirty = true; renderStaff(); flush();
}
async function flush(){
  ls.set(BACKUP, JSON.stringify({ id: dayKeyNow + "_" + me.user, rides, dirty: true }));
  if (saving) return;
  saving = true;
  while (dirty){
    dirty = false;
    const snapshot = rides.slice();
    const { error } = await sb.from("days").upsert({ id: dayKeyNow + "_" + me.user, date: dayKeyNow, username: me.user, rides: snapshot, updated_at: new Date().toISOString() });
    if (error){ dirty = true; break; }
  }
  saving = false;
  if (!dirty) ls.set(BACKUP, JSON.stringify({ id: dayKeyNow + "_" + me.user, rides, dirty: false }));
  $("sSync").hidden = !dirty;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && me && me.role !== "admin"){ if (dateKey() !== dayKeyNow) loadDay(); else if (dirty) flush(); } });

for (let n = 1; n <= 5; n++){
  const b = document.createElement("button");
  b.className = "seat num"; b.textContent = n;
  b.setAttribute("aria-label", n + " kişiyle turu başlat");
  b.onclick = () => {
    if (dateKey() !== dayKeyNow){ dayKeyNow = dateKey(); rides = []; }
    openIdx = -1; pending = null;
    saveDay([...rides, { t: Date.now(), n }]);
    if (navigator.vibrate) navigator.vibrate(40);
    toast(rides.length + ". tur: " + n + " kişi, " + hm(Date.now()));
  };
  $("seats").appendChild(b);
}
$("list").addEventListener("click", e => {
  const el = e.target.closest("[data-i]"); if (!el) return;
  const i = +el.dataset.i;
  if (el.dataset.ok && pending){
    const next = rides.slice();
    if (pending.del){ next.splice(i, 1); toast((i+1) + ". tur silindi"); }
    else { next[i] = { t: next[i].t, n: pending.n }; toast((i+1) + ". tur " + pending.n + " kişi olarak güncellendi"); }
    pending = null; openIdx = -1; return saveDay(next);
  } else if (el.dataset.cancel){ pending = null; }
  else if (el.dataset.n){ if (+el.dataset.n !== rides[i].n) pending = { i, n: +el.dataset.n }; }
  else if (el.dataset.del){ pending = { i, del: true }; }
  else { openIdx = openIdx === i ? -1 : i; pending = null; }
  renderStaff();
});
function renderHead(){
  const c = rides.length, last = rides[c-1];
  $("tourNo").innerHTML = c + "<small>tur</small>";
  $("prompt").textContent = (c + 1) + ". tur: kaç kişi bindi?";
  $("last").innerHTML = last ? "Son tur<b>" + hm(last.t) + "</b>" : "Henüz tur yok";
  $("meta").textContent = c ? "Bugün toplam " + sumN(rides) + " kişi, ilk tur " + hm(rides[0].t) : "Bugün henüz tur yok";
}
function renderStaff(){
  renderHead();
  if (!rides.length){ $("list").innerHTML = '<div class="empty">Henüz tur yok. Kişiler binince sayıya bas.</div>'; return; }
  let html = "";
  for (let i = rides.length - 1; i >= 0; i--){
    const r = rides[i]; let chips = "";
    for (let n = 1; n <= 5; n++) chips += '<button class="chip' + (n === r.n ? " on" : "") + '" data-i="' + i + '" data-n="' + n + '">' + n + '</button>';
    const ask = pending && pending.i === i && i === openIdx;
    html += '<div class="item' + (i === openIdx ? " open" : "") + '">' +
      '<button class="rowbtn" data-i="' + i + '"><span class="no">' + (i+1) + '. tur</span><span class="t">' + hms(r.t) + '</span><span class="k">' + r.n + ' kişi</span></button>' +
      '<div class="edit">' + (ask
        ? '<span class="q">' + (pending.del ? (i+1) + '. tur silinsin mi?' : (i+1) + '. tur ' + r.n + ' → ' + pending.n + ' kişi olsun mu?') + '</span><button class="chip" data-i="' + i + '" data-cancel="1">Vazgeç</button><button class="chip ' + (pending.del ? 'delok' : 'ok') + '" data-i="' + i + '" data-ok="1">' + (pending.del ? 'Sil' : 'Onayla') + '</button>'
        : chips + '<button class="chip del" data-i="' + i + '" data-del="1">Sil</button>') + '</div></div>';
  }
  $("list").innerHTML = html;
}
$("sReport").onclick = () => {
  if (!rides.length) return toast("Rapora eklenecek tur yok");
  exportXlsx(dayKeyNow, [{ user: me.user, rides }], "tren-raporu-" + me.user + "-" + dayKeyNow);
};

// ---------- Yönetici ----------
let days = [], accounts = [], aOpenDay = "", aOpenUser = "", aPwPending = null;

function startAdmin(){
  $("aWho").innerHTML = "Yönetici: <b>" + me.user + "</b>";
  $("aDate").value = dateKey();
  show("vAdmin"); renderAdmin();
  loadAdmin();
  timers.push(setInterval(() => { if (!aPwPending && !aOpenUser) loadAdmin(); }, 20000));
}
async function loadAdmin(){
  const key = $("aDate").value || dateKey();
  const [d, a] = await Promise.all([
    sb.from("days").select("username, rides").eq("date", key),
    sb.from("accounts").select("username, role")
  ]);
  if (d.error || a.error) return toast("Veriler yüklenemedi, interneti kontrol et");
  days = d.data.map(x => ({ user: x.username, rides: x.rides || [] })).filter(x => x.rides.length).sort((x, y) => x.user.localeCompare(y.user));
  accounts = a.data.map(x => ({ user: x.username, role: x.role }));
  renderAdmin();
}
$("aDate").addEventListener("change", () => { aOpenDay = ""; days = []; renderAdmin(); loadAdmin(); });
$("aDays").addEventListener("click", e => {
  const el = e.target.closest("[data-u]"); if (!el) return;
  aOpenDay = aOpenDay === el.dataset.u ? "" : el.dataset.u; renderAdmin();
});
$("aUsers").addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const u = el.dataset.u, act = el.dataset.act;
  if (act === "open"){ aOpenUser = aOpenUser === u ? "" : u; aPwPending = null; return renderAdmin(); }
  if (act === "set"){
    const v = $("pw-" + u).value;
    if (v.length < 4) return toast("Yeni şifre en az 4 karakter olmalı");
    aPwPending = { u, pw: v }; return renderAdmin();
  }
  if (act === "cancel"){ aPwPending = null; return renderAdmin(); }
  if (act === "ok" && aPwPending){
    const { u: uu, pw } = aPwPending;
    const { error } = await sb.from("accounts").update({ hash: await hash(uu, pw) }).eq("username", uu);
    if (error) return toast("Şifre değiştirilemedi, tekrar dene");
    toast(uu + " kullanıcısının şifresi değişti");
    aPwPending = null; aOpenUser = ""; renderAdmin();
  }
});
function renderAdmin(){
  const key = $("aDate").value || dateKey();
  const tours = days.reduce((a, d) => a + d.rides.length, 0), ppl = days.reduce((a, d) => a + sumN(d.rides), 0);
  $("aSum").textContent = trDate(key) + ": " + days.length + " personel, " + tours + " tur, " + ppl + " kişi";
  $("aDays").innerHTML = !days.length ? '<div class="empty">Bu gün için kayıtlı tur yok.</div>' : days.map(d => {
    const r = d.rides;
    const sub = r.map((x, i) => '<div><span>' + (i+1) + '. tur, ' + hms(x.t) + '</span><b>' + x.n + ' kişi</b></div>').join("");
    return '<div class="item' + (aOpenDay === d.user ? " open" : "") + '">' +
      '<button class="rowbtn wide" data-u="' + d.user + '"><span><b>' + d.user + '</b> <span class="muted">' + hm(r[0].t) + '–' + hm(r[r.length-1].t) + '</span></span><span class="k">' + r.length + ' tur, ' + sumN(r) + ' kişi</span></button>' +
      (aOpenDay === d.user ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }).join("");
  const sorted = accounts.slice().sort((a, b) => (b.role === "admin") - (a.role === "admin") || a.user.localeCompare(b.user));
  $("aUsers").innerHTML = !sorted.length ? '<div class="empty">Kullanıcı yok.</div>' : sorted.map(a => {
    const open = aOpenUser === a.user, ask = aPwPending && aPwPending.u === a.user;
    return '<div class="item' + (open ? " open" : "") + '">' +
      '<button class="rowbtn wide" data-act="open" data-u="' + a.user + '"><span><b>' + a.user + '</b></span><span class="muted">' + (a.role === "admin" ? "yönetici" : "personel") + '</span></button>' +
      '<div class="edit">' + (ask
        ? '<span class="q">' + a.user + ' kullanıcısının şifresi değişsin mi?</span><button class="chip" data-act="cancel" data-u="' + a.user + '">Vazgeç</button><button class="chip ok" data-act="ok" data-u="' + a.user + '">Onayla</button>'
        : '<input class="inp" id="pw-' + a.user + '" type="text" placeholder="Yeni şifre" autocomplete="off" autocapitalize="none"><button class="chip ok" data-act="set" data-u="' + a.user + '">Şifreyi değiştir</button>') +
      '</div></div>';
  }).join("");
}
$("aReport").onclick = () => {
  if (!days.length) return toast("Bu gün için rapor alınacak tur yok");
  const key = $("aDate").value || dateKey();
  exportXlsx(key, days, "tren-raporu-" + key);
};

// ---------- Excel ----------
function exportXlsx(key, groups, base){
  if (typeof XLSX === "undefined") return toast("Excel kütüphanesi yüklenemedi, interneti kontrol et");
  const all = groups.flatMap(g => g.rides), totalT = all.length, totalP = sumN(all);
  const sum = [["Tren tur raporu"], [], ["Tarih", trDate(key)], ["Rapor saati", hm(Date.now())], [],
    ["Personel", "Tur", "Kişi", "İlk tur", "Son tur", "Tur başı ort.", "Doluluk (5 koltuk)"]];
  groups.forEach(g => { const r = g.rides, p = sumN(r);
    sum.push([g.user, r.length, p, hm(r[0].t), hm(r[r.length-1].t), Math.round(p / r.length * 100) / 100, Math.round(p / (r.length * 5) * 1000) / 10 + " %"]); });
  sum.push(["TOPLAM", totalT, totalP], [], ["Saat aralığı", "Tur", "Kişi"]);
  const byHour = {};
  all.forEach(r => { const h = new Date(r.t).getHours(); (byHour[h] = byHour[h] || [0,0]); byHour[h][0]++; byHour[h][1] += r.n; });
  Object.keys(byHour).map(Number).sort((a,b) => a-b).forEach(h => sum.push([pad(h) + ":00–" + pad((h+1)%24) + ":00", byHour[h][0], byHour[h][1]]));
  const ws1 = XLSX.utils.aoa_to_sheet(sum); ws1["!cols"] = [{wch:18},{wch:8},{wch:8},{wch:9},{wch:9},{wch:13},{wch:18}];
  const rows = [["Personel", "Tur", "Tarih", "Başlangıç saati", "Kişi sayısı"]];
  groups.forEach(g => g.rides.forEach((r, i) => rows.push([g.user, i + 1, trDate(key), hms(r.t), r.n])));
  rows.push([], ["TOPLAM", totalT, "", "", totalP]);
  const ws2 = XLSX.utils.aoa_to_sheet(rows); ws2["!cols"] = [{wch:18},{wch:6},{wch:12},{wch:16},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, "Özet");
  XLSX.utils.book_append_sheet(wb, ws2, "Turlar");
  const filename = base + ".xlsx";
  const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const file = new File([buf], filename, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  // iPhone'da paylaşım menüsü (Dosyalar'a kaydet, WhatsApp, Mail); diğerlerinde normal indirme
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    navigator.share({ files: [file], title: filename }).catch(e => { if (e.name !== "AbortError") XLSX.writeFile(wb, filename); });
  } else {
    try { XLSX.writeFile(wb, filename); toast("Rapor indirildi"); } catch(e){ toast("Rapor indirilemedi"); }
  }
}
</script>
